[project]
name = "razorpay-autonomous-engineer"
version = "0.1.0"
description = "Agent that recovers abandoned/failed Razorpay orders via test-mode payment links, gated by deterministic evidence-checking, policy, and human approval."
readme = "README.md"
authors = [
    { name = "PRACHI  VEDANT", email = "prachivedant2005@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "python-dotenv>=1.2.3",
    "razorpay>=1.4.0",
    "streamlit>=1.62.0",
]

[project.scripts]
razorpay-autonomous-engineer = "razorpay_autonomous_engineer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
